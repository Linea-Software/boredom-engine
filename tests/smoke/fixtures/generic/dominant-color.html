<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Generic mock — dominant color</title>
</head>
<body>
    <!--
        The dominant-color script picks the largest loaded image (naturalWidth
        > 10). A canvas-drawn data: PNG is same-origin readable, so colorthief
        can extract pixels without CORS issues.
    -->
    <script>
        const canvas = document.createElement("canvas");
        canvas.width = 64;
        canvas.height = 64;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ff0000";
        ctx.fillRect(0, 0, 64, 64);
        const img = document.createElement("img");
        img.id = "hero-image";
        img.alt = "Solid red hero";
        img.src = canvas.toDataURL("image/png");
        document.body.appendChild(img);
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>YouTube mock — low quality</title>
</head>
<body>
    <!--
        Served from fixtures/youtube/watch/... so window.location.href contains
        "/watch", which the script requires before forcing playback quality.
        YouTube exposes the quality methods directly on #movie_player.
    -->
    <div id="movie_player"></div>
    <script>
        window.__qualityCalls = [];
        const player = document.getElementById("movie_player");
        player.setPlaybackQualityRange = (min, max) => window.__qualityCalls.push(["range", min, max]);
        player.setPlaybackQuality = (quality) => window.__qualityCalls.push(["quality", quality]);
    </script>
</body>
</html>

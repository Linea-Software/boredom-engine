name: Release

on:
  schedule:
    # First day of every month at 03:00 UTC, like ace-hosts.
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.repository == 'Linea-Software/boredom-engine' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build and validate resistance archive
        run: bun run test:artifact

      - name: Generate checksums
        run: |
          test -s dist/resistance-scripts.zip
          test -s dist/scripts-data.json
          (cd dist && sha256sum resistance-scripts.zip > sha256_checksums.txt)
          (cd dist && sha256sum --check sha256_checksums.txt)

      - name: Build release notes
        run: |
          cat > /tmp/release-body.md <<EOF
          Automated monthly build of the Boredom Engine resistance scripts.

          - Generated (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)
          - Commit: ${GITHUB_SHA}
          - Assets: resistance-scripts.zip, sha256_checksums.txt, scripts-data.json
          - Validated: TypeScript types, unit tests, production artifact tests

          The archive can be imported from GitHub by an administrator at
          Ace Blocker Site > Admin > Resistance releases, then explicitly published.
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists, replacing it"
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Boredom Engine $(date -u +%Y-%m-%d)" \
            --notes-file /tmp/release-body.md \
            --latest \
            dist/resistance-scripts.zip \
            dist/sha256_checksums.txt \
            dist/scripts-data.json

name: Publish Resistance Mode Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3 or 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: boredom-engine-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, validate and publish ZIP
    if: github.repository == 'Linea-Software/boredom-engine' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate requested version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$INPUT_VERSION"
            if [[ "$release_tag" != v* ]]; then
              release_tag="v$release_tag"
            fi
          else
            release_tag="$REF_NAME"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: use vMAJOR.MINOR.PATCH (e.g. v1.2.3)" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build and validate resistance archive
        run: bun run test:artifact

      - name: Install Chromium for ACE direct-injection smoke tests
        run: bunx playwright install --with-deps chromium

      - name: ACE direct-injection smoke tests
        run: bun run test:smoke --grep "ACE direct injection"

      - name: Generate checksums
        run: |
          test -s dist/resistance-scripts.zip
          test -s dist/scripts-data.json
          (cd dist && sha256sum resistance-scripts.zip > sha256_checksums.txt)
          (cd dist && sha256sum --check sha256_checksums.txt)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Use a new version." >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
              echo "Tag $RELEASE_TAG already exists. Use a new version." >&2
              exit 1
            fi
            # For manual runs GitHub creates the tag at the validated commit.
            gh release create "$RELEASE_TAG" \
              dist/resistance-scripts.zip \
              dist/sha256_checksums.txt \
              dist/scripts-data.json \
              --target "$GITHUB_SHA" \
              --title "Boredom Engine $RELEASE_TAG" \
              --generate-notes \
              --latest
          else
            # For pushed tags, require the tag to already exist on GitHub.
            gh release create "$RELEASE_TAG" \
              dist/resistance-scripts.zip \
              dist/sha256_checksums.txt \
              dist/scripts-data.json \
              --verify-tag \
              --title "Boredom Engine $RELEASE_TAG" \
              --generate-notes \
              --latest
          fi

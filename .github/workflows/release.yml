name: Publish Resistance Mode Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: boredom-engine-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, validate and publish ZIP
    if: github.repository == 'Linea-Software/boredom-engine'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build and validate distribution
        run: bun run test:artifact

      - name: Produce SHA-256 checksums
        shell: bash
        run: |
          test -s dist/resistance-scripts.zip
          test -s dist/scripts-data.json
          (cd dist && sha256sum resistance-scripts.zip > sha256_checksums.txt)
          (cd dist && sha256sum --check sha256_checksums.txt)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/resistance-scripts.zip \
            dist/sha256_checksums.txt \
            dist/scripts-data.json \
            --verify-tag \
            --title "Boredom Engine $RELEASE_TAG" \
            --generate-notes \
            --latest
